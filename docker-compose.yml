# Serviços LOCAIS de desenvolvimento (ADR-0005). Variáveis lidas do `.env` gerado por
# `pnpm env:local`. Não use estes serviços para dados reais.
name: ppgps-portal

services:
  postgres:
    # Mesma versão maior do Neon (PostgreSQL 18).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?execute pnpm env:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?execute pnpm env:local}
      POSTGRES_DB: ${POSTGRES_DB:-ppgps}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    # Storage S3 compatível local; usado pelo adaptador de storage a partir da S02.
    # A MinIO deixou de publicar imagens oficiais (Docker Hub/Quay) em 2025; usa-se a
    # imagem mantida pela Chainguard, fixada por digest para reprodutibilidade.
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?execute pnpm env:local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?execute pnpm env:local}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    # Imagem distroless (sem shell/curl): sem healthcheck; `--wait` aguarda o estado "running".

  mailpit:
    # Captura local de e-mails (S02): nada sai da máquina. Interface em http://localhost:8025.
    image: axllent/mailpit:v1.29.1@sha256:7c38788069433ba9d2d9131abac8d17da0fb18f09b689207ec7a773dcb8d6eee
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  pgdata:
  miniodata:
