name: Preparar Node e pnpm
description: Instala Node (versão do .nvmrc), pnpm (versão do packageManager) e dependências com lockfile congelado.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: '0'
