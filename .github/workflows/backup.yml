name: Backup criptografado (homologação)

# Planejamento 17.5 e 24.5; ADR-0012.
# - Diário: pg_dump do banco de HOMOLOGAÇÃO, criptografado com age (chave pública) antes de
#   gravar em disco. A chave privada NÃO é usada aqui.
# - Destino: bucket R2 `ppgps-backups` (prefixo staging/, retenção 7 dias) com credenciais
#   exclusivas de backup. Enquanto elas não existirem no ambiente `backups`, o arquivo
#   criptografado fica como artefato do GitHub (7 dias) e o job registra a pendência.
# - Produção: não habilitado nesta fase (S06). Nenhuma operação na branch `production`.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: backup-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump + age (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    outputs:
      base: ${{ steps.names.outputs.base }}
    steps:
      - name: Verificar configuração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          [[ -n "$DATABASE_URL" ]] || { echo "::error::DATABASE_URL ausente no ambiente staging"; exit 1; }
          [[ "$BACKUP_AGE_RECIPIENT" == age1* ]] || { echo "::error::BACKUP_AGE_RECIPIENT (variável) ausente"; exit 1; }
      - uses: actions/checkout@v5
      - name: Backup criptografado (pg_dump 18 + age no contêiner postgres:18)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          mkdir -p out
          docker run --rm -e DATABASE_URL -e BACKUP_AGE_RECIPIENT \
            -v "$PWD/scripts:/scripts:ro" -v "$PWD/out:/out" postgres:18-alpine \
            sh -c 'apk add --no-cache age jq bash coreutils >/dev/null && bash /scripts/backup/backup.sh staging /out'
          ls -l out
      - id: names
        run: echo "base=$(basename out/*.dump.age .dump.age)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: backup-staging
          path: out/
          retention-days: 7
          if-no-files-found: error

  upload:
    name: Enviar ao bucket de backups (R2)
    needs: dump
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: backups
    steps:
      - name: Verificar credenciais exclusivas de backup
        id: config
        env:
          KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$KEY" || -z "$SECRET" ]]; then
            echo "::warning::R2_BACKUP_ACCESS_KEY_ID/R2_BACKUP_SECRET_ACCESS_KEY ausentes no ambiente 'backups'. Backup mantido apenas como artefato criptografado do GitHub (7 dias)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/download-artifact@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          name: backup-staging
          path: out
      - name: Enviar e aplicar retenção (7 dias)
        if: steps.config.outputs.enabled == 'true'
        env:
          BACKUP_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.R2_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.R2_BACKUP_BUCKET || 'ppgps-backups' }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_RETENTION_DAYS: '7'
        run: |
          base="${{ needs.dump.outputs.base }}"
          node scripts/backup/upload.mjs "out/${base}.dump.age" "out/${base}.manifest.json" staging
