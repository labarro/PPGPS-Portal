name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  APP_ENV: local

jobs:
  quality:
    name: Lint, formatação e tipos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Testes unitários (cobertura)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage

  integration:
    name: Testes de integração (Postgres de serviço)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ppgps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ppgps_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ppgps_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-services
      - name: Segredo efêmero do Payload
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # O globalSetup aplica as migrations versionadas antes dos testes.
      - run: pnpm test:int

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ppgps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ppgps_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ppgps_test
      E2E_SERVER_COMMAND: pnpm start --port 3100
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-services
      - name: Segredo efêmero do Payload
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrations (job separado do build)
        run: pnpm migrate && pnpm migrate:status
      - name: Conteúdo institucional da S03 (seed idempotente)
        run: pnpm seed:content
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (mobile, orçamentos)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ppgps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ppgps_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ppgps_test
      PORT: '3100'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-services
      - name: Segredo efêmero do Payload
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrations e conteúdo institucional (seed)
        run: pnpm migrate && pnpm seed:content
      - run: pnpm build
      - name: Servidor de produção local (porta 3100)
        run: |
          pnpm start --port 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3100/robots.txt; then exit 0; fi
            sleep 2
          done
          cat /tmp/next.log
          exit 1
      # Relatórios só em disco (artefato do run): nada é enviado a serviços externos.
      # `is-crawlable` é ignorado: fora da produção o site é `noindex` de propósito.
      - name: Lighthouse CI (acessibilidade e SEO ≥ 0,90; orçamentos de JS e terceiros)
        run: pnpm dlx @lhci/cli@0.15.1 autorun
      - name: Resumo das notas
        if: always()
        run: |
          {
            echo '### Lighthouse (mobile)'
            echo ''
            echo '| Página | Desempenho | Acessibilidade | Boas práticas | SEO | JS (bytes) |'
            echo '|---|---|---|---|---|---|'
            for f in .lighthouseci/lhr-*.json; do
              [ -f "$f" ] || continue
              jq -r '[.finalDisplayedUrl, .categories.performance.score, .categories.accessibility.score, .categories["best-practices"].score, .categories.seo.score, ([.audits["resource-summary"].details.items[] | select(.resourceType=="script") | .transferSize] | first)] | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) | \(.[4]) | \(.[5]) |"' "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  build:
    name: Build sem acesso ao banco
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Banco inacessível de propósito: prova que `next build` não conecta nem migra (ADR-0005).
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/unreachable
      PAYLOAD_SECRET: build-only-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high
