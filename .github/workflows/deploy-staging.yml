name: Deploy de homologação (staging)

# Cada merge na main: migrate staging (job dedicado com trava de concorrência) ->
# deploy na Vercel com APP_ENV=staging -> fumaça. Também atualiza o branch Neon `seed`
# (base dos previews) com as migrations novas e o seed fictício. ADR-0005 / ADR-0009.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Ensaio do modo de manutenção (painel somente leitura) — S06'
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrate-staging:
    name: Migrations em staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    env:
      APP_ENV: staging
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Verificar configuração
        id: config
        run: |
          if [[ -z "$DATABASE_URL" || -z "$PAYLOAD_SECRET" ]]; then
            echo "::warning::Ambiente 'staging' sem DATABASE_URL/PAYLOAD_SECRET. Homologação não atualizada."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.config.outputs.enabled == 'true'
      - name: Aplicar migrations (nunca no build)
        if: steps.config.outputs.enabled == 'true'
        run: |
          pnpm migrate
          pnpm migrate:status
      # Conteúdo institucional público verificado (S03): só preenche o que não existe;
      # nunca sobrescreve edições feitas no painel de homologação.
      - name: Conteúdo institucional (seed idempotente)
        if: steps.config.outputs.enabled == 'true'
        run: pnpm seed:content

  refresh-seed:
    name: Atualizar branch Neon seed (base dos previews)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: migrate-seed
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      APP_ENV: preview
    steps:
      - name: Verificar configuração
        id: config
        run: |
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" || -z "$PAYLOAD_SECRET" ]]; then
            echo "::warning::Ambiente 'preview' sem NEON_API_KEY/NEON_PROJECT_ID/PAYLOAD_SECRET. Seed não atualizado."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.config.outputs.enabled == 'true'
      - name: Migrations + seed fictício no branch seed
        if: steps.config.outputs.enabled == 'true'
        run: |
          DATABASE_URL=$(pnpm dlx neon@8.8.0 connection-string seed --project-id "$NEON_PROJECT_ID" --no-analytics | tail -n 1)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm migrate
          pnpm migrate:status
          pnpm seed:content
          if [[ -n "$SEED_ADMIN_EMAIL" && -n "$SEED_ADMIN_PASSWORD" ]]; then
            pnpm seed
          else
            echo "::notice::SEED_ADMIN_* ausentes: conta fictícia não criada no seed."
          fi

  deploy-staging:
    name: Deploy e fumaça (staging)
    needs: migrate-staging
    if: needs.migrate-staging.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Verificar configuração da Vercel
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::warning::VERCEL_TOKEN ausente: deploy de homologação não executado."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.config.outputs.enabled == 'true'
      - name: Verificação real do bucket R2 de homologação (objeto de 64 bytes, removido)
        if: steps.config.outputs.enabled == 'true'
        env:
          S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          S3_REGION: ${{ vars.R2_REGION }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/storage/r2-smoke.mjs
      - name: Deploy (Vercel, alvo preview com APP_ENV=staging)
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL_POOLED }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          # Storage R2 de homologação (ADR-0011) e URL fixa para links de e-mail. Somente servidor.
          S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          S3_REGION: ${{ vars.R2_REGION }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SERVER_URL: ${{ vars.STAGING_DOMAIN != '' && format('https://{0}', vars.STAGING_DOMAIN) || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SMTP_IS_SANDBOX: ${{ vars.EMAIL_SMTP_IS_SANDBOX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MAINTENANCE_MODE: ${{ github.event.inputs.maintenance == 'true' && 'true' || '' }}
        run: bash scripts/ci/vercel-deploy.sh preview
      - name: Fumaça (deploy)
        if: steps.config.outputs.enabled == 'true'
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECT_MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && 'true' || '' }}
        run: bash scripts/ci/smoke-deployment.sh "${{ steps.deploy.outputs.deployment_url }}" protected
      - name: Apontar domínio fixo de homologação
        if: steps.config.outputs.enabled == 'true' && vars.STAGING_DOMAIN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        # API REST: o token com escopo de projeto não pode carregar o usuário (exigido por `vercel alias`).
        run: |
          host="${DEPLOY_URL#https://}"
          status=$(curl -sS -o /tmp/alias.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.vercel.com/v2/deployments/${host}/aliases?teamId=${VERCEL_ORG_ID}" \
            -d "{\"alias\":\"${STAGING_DOMAIN}\"}")
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "::error::Falha ao apontar ${STAGING_DOMAIN} (HTTP ${status}): $(jq -r '.error.message // .' /tmp/alias.json)"
            exit 1
          fi
          echo "https://${STAGING_DOMAIN} -> ${DEPLOY_URL}"
      - name: Fumaça (domínio fixo de homologação)
        if: steps.config.outputs.enabled == 'true' && vars.STAGING_DOMAIN != ''
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECT_MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && 'true' || '' }}
        run: bash scripts/ci/smoke-deployment.sh "https://${{ vars.STAGING_DOMAIN }}" protected
