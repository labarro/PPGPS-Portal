name: Deploy de produção (release aprovada)

# Somente por tag vX.Y.Z na main, disparado pelo dono do repositório com a variável
# PRODUCTION_DEPLOY_ENABLED=true. O ambiente GitHub `production` só aceita tags v*.*.*.
# Ordem (ADR-0005): ponto de restauração -> migrate (trava de concorrência) + conteúdo
# institucional e conta admin inicial (idempotentes) -> verificação do R2 -> deploy -> fumaça
# no domínio oficial https://bioeticaps.app (ADR-0014). Runbook: docs/runbooks/deploy.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release já existente (ex.: v1.0.0). Dispare com --ref <tag>.'
        required: true
      maintenance:
        description: 'Publicar com modo de manutenção ativo (painel somente leitura)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Validar release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Trava independente do plano do GitHub: só o supervisor define PRODUCTION_DEPLOY_ENABLED
      # (Settings → Variables) e só o dono do repositório pode disparar o deploy.
      - name: Trava de produção (habilitação explícita do supervisor)
        env:
          ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::Deploy de produção desabilitado (variável PRODUCTION_DEPLOY_ENABLED != true)."
            exit 1
          fi
          if [[ "$ACTOR" != "$OWNER" ]]; then
            echo "::error::Somente o dono do repositório ($OWNER) pode disparar o deploy de produção."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag semântica e contida na main
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inválida: $RELEASE_TAG"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main || { echo "::error::A tag não está na main"; exit 1; }

  restore-point:
    name: Ponto de restauração (branch Neon predeploy)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH || 'production' }}
    steps:
      - name: Criar predeploy-<tag>-<execução> e manter só os 2 mais recentes
        run: |
          neon() { npx -y neon@8.8.0 "$@" --no-analytics; }
          name="predeploy-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          neon branches create --project-id "$NEON_PROJECT_ID" --name "$name" \
            --parent "$NEON_PRODUCTION_BRANCH" --no-compute --no-secrets --output json >/dev/null
          echo "Ponto de restauração criado: $name"
          neon branches list --project-id "$NEON_PROJECT_ID" --output json \
            | jq -r '[.[] | select(.name | startswith("predeploy-"))] | sort_by(.created_at) | reverse | .[2:] | .[].name' \
            | while read -r old; do [[ -n "$old" ]] && neon branches delete "$old" --project-id "$NEON_PROJECT_ID"; done

  migrate:
    name: Migrations, conteúdo institucional e conta admin (produção)
    needs: restore-point
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup
      - run: pnpm migrate
      - run: pnpm migrate:status
      # Conteúdo público verificado (S03–S06): idempotente, nunca sobrescreve edições do painel;
      # sem pessoas, ensaios ou dados fictícios (seed:people/seed:essays/seed continuam bloqueados).
      - name: Conteúdo institucional (idempotente)
        env:
          SEED_CONTENT_ALLOW_PRODUCTION: 'true'
        run: pnpm seed:content
      # Primeira conta admin (somente se o banco não tiver contas). Senha aleatória descartada:
      # o titular define a senha pela recuperação de senha.
      - name: Conta admin inicial (idempotente)
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          if [[ -z "$BOOTSTRAP_ADMIN_EMAIL" ]]; then
            echo "::notice::BOOTSTRAP_ADMIN_EMAIL ausente: nenhuma conta criada."
          else
            pnpm users:bootstrap-admin
          fi

  deploy:
    name: Deploy e fumaça (produção)
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup
      - name: Verificação real do bucket R2 de produção (objeto de 64 bytes, removido)
        env:
          S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          S3_REGION: ${{ vars.R2_REGION }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_SMOKE_ALLOW_PRODUCTION: 'true'
        run: node scripts/storage/r2-smoke.mjs
      - name: Deploy (Vercel --prod)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL_POOLED }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          # Domínio oficial (ADR-0014).
          SERVER_URL: ${{ vars.PRODUCTION_DOMAIN != '' && format('https://{0}', vars.PRODUCTION_DOMAIN) || 'https://bioeticaps.app' }}
          S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          S3_REGION: ${{ vars.R2_REGION }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || vars.SMTP_SECURE }}
          EMAIL_FROM_ADDRESS: ${{ secrets.SMTP_FROM || vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAINTENANCE_MODE: ${{ github.event.inputs.maintenance == 'true' && 'true' || '' }}
        run: bash scripts/ci/vercel-deploy.sh production
      # O deploy de produção recebe o domínio oficial automaticamente (alvo production da Vercel).
      # A URL própria do deploy fica atrás da proteção da Vercel; a fumaça usa o domínio.
      - name: Fumaça pós-deploy (domínio oficial)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_DOMAIN != '' && format('https://{0}', vars.PRODUCTION_DOMAIN) || 'https://bioeticaps.app' }}
          EXPECT_MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && 'true' || '' }}
        run: bash scripts/ci/smoke-deployment.sh "$PRODUCTION_URL" production
